name: Daterangepicker Material CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # The library carries no specs, so what CI can attest is that it still compiles and still packages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lockfile predates npm's strict peer resolution, and @angular-devkit/build-angular
      # declares ng-packagr as a peer of the very version pinned here.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
